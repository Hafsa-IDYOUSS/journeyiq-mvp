
version: 2

models:
  - name: stg_ga4_events
    description: "Cleaned GA4 events sourced from the Databricks Silver Delta table."
    columns:
      - name: event_name
        data_tests:
          - not_null
      - name: session_key
        data_tests:
          - not_null

  - name: int_session_funnel
    description: "One row per session with sequential funnel-stage indicators."
    columns:
      - name: session_key
        data_tests:
          - unique
          - not_null

  - name: fct_funnel_metrics
    description: "Session-based conversion and drop-off KPIs across three funnel stages."
    columns:
      - name: stage_order
        data_tests:
          - unique
          - not_null
      - name: stage
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Product View
                  - Checkout
                  - Purchase
      - name: sessions
        data_tests:
          - not_null
